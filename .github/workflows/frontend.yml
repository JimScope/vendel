name: Frontend

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"

permissions:
  contents: read

jobs:
  quality:
    name: Lint, Typecheck & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint (biome)
        run: bun run lint

      - name: Typecheck
        run: bunx tsc -p tsconfig.build.json --noEmit

      - name: Build
        run: bun run build

  e2e:
    name: Playwright E2E (best-effort)
    runs-on: ubuntu-latest
    # E2E needs a live, seeded backend plus the Vite dev server. It is wired
    # end-to-end here, but kept non-blocking (continue-on-error) so backend
    # data-seeding flakiness never gates a frontend PR. Promote to a required
    # check once it proves stable.
    continue-on-error: true
    env:
      FIRST_SUPERUSER: admin@vendel.cc
      FIRST_SUPERUSER_PASSWORD: changethis1234
      WEBHOOK_ENCRYPTION_KEY: ci-test-encryption-key
      VITE_API_URL: http://localhost:8090
      APP_URL: http://localhost:8090
      FRONTEND_URL: http://localhost:5173
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Build backend
        working-directory: backend
        run: go build -o vendel .

      - name: Write root .env for tests
        # frontend/tests/config.ts loads superuser credentials from ../../.env
        run: |
          {
            echo "FIRST_SUPERUSER=${FIRST_SUPERUSER}"
            echo "FIRST_SUPERUSER_PASSWORD=${FIRST_SUPERUSER_PASSWORD}"
            echo "WEBHOOK_ENCRYPTION_KEY=${WEBHOOK_ENCRYPTION_KEY}"
          } > .env

      - name: Start backend
        working-directory: backend
        run: |
          ./vendel serve --http=0.0.0.0:8090 &
          echo $! > /tmp/backend.pid
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8090/api/health >/dev/null; then
              echo "Backend is up"
              exit 0
            fi
            sleep 2
          done
          echo "Backend failed to start" >&2
          exit 1

      - name: Install frontend dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        working-directory: frontend
        run: bunx playwright install --with-deps chromium

      - name: Run Playwright tests
        working-directory: frontend
        run: bunx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/blob-report/
          if-no-files-found: ignore

      - name: Stop backend
        if: always()
        run: kill "$(cat /tmp/backend.pid)" 2>/dev/null || true
