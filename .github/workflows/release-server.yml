name: Release Server

on:
  push:
    tags:
      - "v*"
      - "!modem-agent/**"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Build frontend
        run: cd frontend && bun install --frozen-lockfile && bun run build

      - name: Copy frontend to backend
        run: cp -r frontend/dist/* backend/ui/dist/

      - name: Restore clean git state
        run: git checkout -- .

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod

      # Use the annotated tag message as the release notes instead of an
      # auto-generated commit list. Write `git tag -a` a curated changelog.
      - name: Extract release notes from tag annotation
        run: git tag -l --format='%(contents)' "${GITHUB_REF_NAME}" > "${RUNNER_TEMP}/release-notes.md"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean --release-notes=${{ runner.temp }}/release-notes.md
          workdir: backend
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
